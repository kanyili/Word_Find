<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尋字高手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .grid-cell {
            user-select: none;
            touch-action: manipulation;
        }
        /* 自定義 12 欄網格 */
        .grid-cols-12-custom {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
        }
        /* 破關時的字體閃爍與大小縮放動畫 */
        @keyframes pulse-scale {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 10px rgba(234, 179, 8, 0.8);
            }
            50% {
                transform: scale(1.15);
                box-shadow: 0 0 20px rgba(234, 179, 8, 1);
            }
        }
        .animate-win-pulse {
            animation: pulse-scale 0.8s infinite ease-in-out;
            background-color: #eab308 !important; /* 金黃色閃爍 */
            color: #ffffff !important;
            z-index: 10;
        }

        /* 煙火動畫與粒子 */
        @keyframes firework {
            0% { transform: translate(var(--x), var(--initialY)); width: 0; height: 0; opacity: 1; }
            50% { opacity: 1; }
            100% { transform: translate(var(--x), var(--finalY)); width: 120px; height: 120px; opacity: 0; border-radius: 50%; }
        }
        .firework {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            box-shadow: 
                0 0 #fff, 0 0 #ff0, 0 0 #0ff, 0 0 #f0f, 0 0 #0f0,
                0 0 #ff4500, 0 0 #ff1493, 0 0 #00ffff, 0 0 #adff2f, 0 0 #ffd700;
            animation: firework 1.5s infinite ease-out;
            pointer-events: none;
            z-index: 20;
        }

        /* 畫面淡出效果 */
        .fade-out {
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
    </style>
</head>
<body id="main-body" class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 overflow-hidden transition-all duration-1000">

    <!-- 誇張煙火容器 -->
    <div id="fireworks-container" class="fixed inset-0 pointer-events-none hidden z-20 overflow-hidden">
        <div class="firework" style="--x: -120px; --initialY: 100vh; --finalY: -150px; animation-delay: 0s;"></div>
        <div class="firework" style="--x: 100px; --initialY: 100vh; --finalY: -180px; animation-delay: 0.3s;"></div>
        <div class="firework" style="--x: -200px; --initialY: 100vh; --finalY: -80px; animation-delay: 0.6s;"></div>
        <div class="firework" style="--x: 180px; --initialY: 100vh; --finalY: -120px; animation-delay: 0.9s;"></div>
        <div class="firework" style="--x: 0px; --initialY: 100vh; --finalY: -220px; animation-delay: 0.4s;"></div>
        <div class="firework" style="--x: -80px; --initialY: 100vh; --finalY: -200px; animation-delay: 0.7s;"></div>
        <div class="firework" style="--x: 120px; --initialY: 100vh; --finalY: -100px; animation-delay: 1.1s;"></div>
    </div>

    <!-- 遊戲外框容器 -->
    <div id="game-card" class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-4 sm:p-6 flex flex-col items-center relative overflow-visible z-30 transition-all duration-1000">
        
        <!-- 🏆 過關頂端橫幅 -->
        <div id="win-banner" class="w-full bg-emerald-500 text-white px-4 py-2.5 rounded-xl mb-3 shadow-md flex items-center justify-between hidden transition-all duration-300">
            <div class="flex items-center space-x-2 text-xs sm:text-sm font-bold">
                <span>🎉</span>
                <span>恭喜完成第 <span id="cleared-level">1</span> 關！耗時 <span id="final-time">00:00</span></span>
            </div>
            <button id="next-btn" onclick="nextLevel()" class="bg-white text-emerald-600 hover:bg-emerald-50 px-3 py-1 rounded-lg text-xs font-bold transition shadow-sm cursor-pointer">
                下一關 ➔
            </button>
        </div>

        <!-- 遊戲主標題 Banner -->
        <h1 id="game-title" class="text-xl sm:text-2xl font-bold text-slate-700 mb-3 text-center transition-all duration-300">
            ✨ <span id="level-title-text">你們要為耶路撒冷求平安</span> ✨
        </h1>

        <!-- 遊戲棋盤容器 -->
        <div class="overflow-x-auto w-full max-w-full flex justify-center pb-1 mb-3">
            <div id="board" class="grid-cols-12-custom gap-1 sm:gap-1.5 bg-slate-200 p-2 rounded-xl shadow-inner select-none">
                <!-- 動態生成 12x12 棋盤 -->
            </div>
        </div>

        <!-- 控制列：計時器、提示按鈕 -->
        <div class="flex flex-wrap items-center justify-between w-full max-w-md gap-3 px-1">
            <div class="flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-lg">
                <span class="text-xs sm:text-sm font-medium text-slate-600">⏱️ 時間:</span>
                <span id="timer" class="text-base sm:text-lg font-bold text-indigo-600 font-mono">00:00</span>
            </div>
            <div class="text-xs font-bold text-indigo-500 bg-indigo-50 px-3 py-1.5 rounded-lg">
                關卡: <span id="level-indicator">1</span> / <span id="total-levels">5</span>
            </div>
            <div>
                <button id="hint-btn" onclick="showHint()" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg font-medium shadow-sm transition active:scale-95 text-xs sm:text-sm flex items-center gap-1">
                    💡 提示
                </button>
            </div>
        </div>
    </div>

    <!-- 🌟 全破關時顯示的金句覆蓋畫面 (預設隱藏) -->
    <div id="final-verse-screen" class="fixed inset-0 bg-slate-900 bg-opacity-90 flex flex-col items-center justify-center p-6 z-50 opacity-0 pointer-events-none transition-opacity duration-1000">
        <div class="text-center max-w-lg space-y-6">
            <div class="text-4xl">✨🕊️✨</div>
            <p class="text-2xl sm:text-3xl font-bold text-white tracking-wide leading-relaxed">
                「你們要為耶路撒冷求平安」
            </p>
            <p class="text-lg sm:text-xl text-amber-300 font-medium">
                （詩篇 122:6a）
            </p>
            <div class="pt-6">
                <button onclick="location.reload()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg transition transform hover:scale-105 cursor-pointer">
                    再玩一次 ↺
                </button>
            </div>
        </div>
    </div>

    <script>
        const LEVELS = [
            {
                answer: "你們要為耶路撒冷求平安", 
                chars: ['你', '們', '要', '為', '耶', '路', '撒', '冷', '求', '平', '安']
            },
            {
                answer: "我心裡所渴望的",
                chars: ['我', '心', '裡', '所', '渴', '望', '的']
            },
            {
                answer: "是要以色列人得救。",
                chars: ['是', '要', '以', '色', '列', '人', '得', '救', '。']
            },
            {
                answer: "那要從你而出的必得救",
                chars: ['那', '要', '從', '你', '而', '出', '的', '必', '得', '救']
            },
            {
                answer: "福音本是神的大能",
                chars: ['福', '音', '本', '是', '神', '的', '大', '能']
            }
        ];

        let currentLevelIndex = 0; 
        let currentAnswer = "";
        let currentChars = [];
        const SIZE = 12; 

        let grid = []; 
        let answerPositions = []; 
        let selectedCells = new Set(); 
        let isGameWon = false;
        
        let timerInterval = null;
        let secondsElapsed = 0;
        let hintTimeout = null;

        const DIRECTIONS = [
            [0, 1],   // 左右
            [0, -1],  // 右左
            [1, 0],   // 上下
            [-1, 0],  // 下上
            [1, 1],   // 左上->右下
            [1, -1],  // 左下->右上
            [-1, 1],  // 右上->左下
            [-1, -1]  // 右下->左上
        ];

        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('timer').textContent = `${mins}:${secs}`;
        }

        function checkValidBoard(testGrid, correctPosSet) {
            let ansLen = currentAnswer.length;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    for (let [dr, dc] of DIRECTIONS) {
                        let match = true;
                        let coords = [];
                        for (let i = 0; i < ansLen; i++) {
                            let nr = r + dr * i;
                            let nc = c + dc * i;
                            if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) {
                                match = false;
                                break;
                            }
                            coords.push(`${nr},${nc}`);
                            if (testGrid[nr][nc] !== currentAnswer[i]) {
                                match = false;
                                break;
                            }
                        }
                        if (match) {
                            let isExactOurAnswer = coords.every(coord => correctPosSet.has(coord));
                            if (!isExactOurAnswer) {
                                return false; 
                            }
                        }
                    }
                }
            }
            return true;
        }

        function generateBoard() {
            let ansLen = currentAnswer.length;
            let maxAttempts = 1000;
            
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                let tempGrid = Array.from({ length: SIZE }, () => Array(SIZE).fill(''));
                let correctPosSet = new Set();
                let currentPosArr = [];

                let r = Math.floor(Math.random() * SIZE);
                let c = Math.floor(Math.random() * SIZE);
                let [dr, dc] = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];

                if (r + dr * (ansLen - 1) >= 0 && r + dr * (ansLen - 1) < SIZE && c + dc * (ansLen - 1) >= 0 && c + dc * (ansLen - 1) < SIZE) {
                    let tempCoords = [];
                    for (let i = 0; i < ansLen; i++) {
                        let nr = r + dr * i;
                        let nc = c + dc * i;
                        tempCoords.push({ r: nr, c: nc });
                    }

                    for (let i = 0; i < ansLen; i++) {
                        tempGrid[tempCoords[i].r][tempCoords[i].c] = currentAnswer[i];
                        correctPosSet.add(`${tempCoords[i].r},${tempCoords[i].c}`);
                    }
                    currentPosArr = tempCoords;

                    for (let i = 0; i < SIZE; i++) {
                        for (let j = 0; j < SIZE; j++) {
                            if (tempGrid[i][j] === '') {
                                tempGrid[i][j] = currentChars[Math.floor(Math.random() * currentChars.length)];
                            }
                        }
                    }

                    if (checkValidBoard(tempGrid, correctPosSet)) {
                        grid = tempGrid;
                        answerPositions = currentPosArr;
                        return true;
                    }
                }
            }

            let tempGrid = Array.from({ length: SIZE }, () => Array(SIZE).fill(''));
            let correctPosSet = new Set();
            let currentPosArr = [];
            for (let i = 0; i < ansLen; i++) {
                tempGrid[0][i] = currentAnswer[i];
                correctPosSet.add(`0,${i}`);
                currentPosArr.push({ r: 0, c: i });
            }
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    if (tempGrid[i][j] === '') {
                        tempGrid[i][j] = currentChars[Math.floor(Math.random() * currentChars.length)];
                    }
                }
            }
            grid = tempGrid;
            answerPositions = currentPosArr;
            return true;
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = `grid-cell w-6 h-6 sm:w-8 sm:h-8 md:w-9 md:h-9 flex items-center justify-center text-xs sm:text-sm md:text-base font-bold bg-white rounded cursor-pointer transition-all duration-150 shadow-sm hover:bg-indigo-50`;
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.textContent = grid[r][c];

                    const key = `${r},${c}`;
                    if (selectedCells.has(key)) {
                        cell.classList.remove('bg-white', 'hover:bg-indigo-50');
                        cell.classList.add('bg-indigo-600', 'text-white', 'shadow-md');
                    }

                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardEl.appendChild(cell);
                }
            }
        }

        function handleCellClick(r, c) {
            if (isGameWon) return;

            const key = `${r},${c}`;
            if (selectedCells.has(key)) {
                selectedCells.delete(key);
            } else {
                selectedCells.add(key);
            }

            renderBoard();
            checkWinCondition();
        }

        function checkWinCondition() {
            if (selectedCells.size !== currentAnswer.length) return;

            let win = true;
            for (let pos of answerPositions) {
                if (!selectedCells.has(`${pos.r},${pos.c}`)) {
                    win = false;
                    break;
                }
            }

            if (win) {
                isGameWon = true;
                stopTimer();
                highlightAnswer();
                triggerWinEffects();
            }
        }

        function highlightAnswer() {
            const boardEl = document.getElementById('board');
            const cells = boardEl.children;
            for (let i = 0; i < cells.length; i++) {
                const cell = cells[i];
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                
                if (answerPositions.some(p => p.r === r && p.c === c)) {
                    cell.className = `grid-cell w-6 h-6 sm:w-8 sm:h-8 md:w-9 md:h-9 flex items-center justify-center text-xs sm:text-sm md:text-base font-bold rounded shadow-md animate-win-pulse`;
                }
            }
        }

        function showHint() {
            if (isGameWon) return;
            if (hintTimeout) clearTimeout(hintTimeout);

            const firstPos = answerPositions[0];
            const boardEl = document.getElementById('board');
            const index = firstPos.r * SIZE + firstPos.c;
            const targetCell = boardEl.children[index];

            if (targetCell) {
                targetCell.className = `grid-cell w-6 h-6 sm:w-8 sm:h-8 md:w-9 md:h-9 flex items-center justify-center text-xs sm:text-sm md:text-base font-bold bg-amber-400 text-white rounded shadow-lg scale-110 transition-all duration-200`;
                
                hintTimeout = setTimeout(() => {
                    renderBoard(); 
                }, 1000);
            }
        }

        function triggerWinEffects() {
            const fireworks = document.getElementById('fireworks-container');
            fireworks.classList.remove('hidden');

            const banner = document.getElementById('win-banner');
            document.getElementById('cleared-level').textContent = currentLevelIndex + 1;
            
            const finalTimeEl = document.getElementById('final-time');
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            finalTimeEl.textContent = `${mins}:${secs}`;
            
            // 如果是最後一關，修改過關橫幅的按鈕文字與行為
            const nextBtn = document.getElementById('next-btn');
            if (currentLevelIndex >= LEVELS.length - 1) {
                nextBtn.textContent = "完成 ➔";
                nextBtn.onclick = showFinalVerse;
            } else {
                nextBtn.textContent = "下一關 ➔";
                nextBtn.onclick = nextLevel;
            }

            banner.classList.remove('hidden');
        }

        function loadLevel() {
            const levelData = LEVELS[currentLevelIndex];
            currentAnswer = levelData.answer;
            currentChars = levelData.chars;

            document.getElementById('level-title-text').textContent = currentAnswer;
            document.getElementById('level-indicator').textContent = currentLevelIndex + 1;
            document.getElementById('total-levels').textContent = LEVELS.length;

            isGameWon = false;
            selectedCells.clear();
            if (hintTimeout) clearTimeout(hintTimeout);

            const gameTitle = document.getElementById('game-title');
            gameTitle.classList.remove('hidden');

            const fireworks = document.getElementById('fireworks-container');
            fireworks.classList.add('hidden');
            const banner = document.getElementById('win-banner');
            banner.classList.add('hidden');

            generateBoard();
            renderBoard();
            startTimer();
        }

        function nextLevel() {
            currentLevelIndex++;
            loadLevel();
        }

        // 🌟 顯示最終金句與畫面淡出效果
        function showFinalVerse() {
            // 讓整個遊戲主畫面淡出
            const gameCard = document.getElementById('game-card');
            const fireworks = document.getElementById('fireworks-container');
            
            gameCard.classList.add('fade-out');
            fireworks.classList.add('fade-out');

            setTimeout(() => {
                gameCard.style.display = 'none';
                fireworks.style.display = 'none';
                
                // 顯示金句畫面
                const finalScreen = document.getElementById('final-verse-screen');
                finalScreen.classList.remove('opacity-0', 'pointer-events-none');
                finalScreen.classList.add('opacity-100');
            }, 1000); // 等待淡出動畫 1 秒後切換
        }

        window.onload = () => {
            loadLevel();
        };
    </script>
</body>
</html>
